# =============================================================================
# [UML: Component Diagram] «API Gateway» routing table
#   Client ---> API Gateway ---> Order Service
#                            \--> User Service
#
# [ARCH: MICROSERVICES]
#   - no datasource at all: the gateway owns no business data.
#   - Inventory / Payment / Notification have NO route: they are internal
#     services reached via broker or service-to-service calls only.
#   - URIs are ENVIRONMENT values, not compile-time references. This is the code
#     form of the "dependency between components" on the Component Diagram.
# =============================================================================
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/users/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
